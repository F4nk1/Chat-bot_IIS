<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Académico IIS - Extensión</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="chatbot-popup-ventana">
        <div id="chatbot-popup-header">
            <div id="chatbot-popup-header-info">
                <img src="../assets/DinoBot02.png" id="chatbot-popup-header-avatar" alt="DinoBot" />
                <div>
                    <div id="chatbot-popup-header-title">DinoBot</div>
                    <div id="chatbot-popup-header-status">
                        <span id="chatbot-popup-status-dot"></span>
                        Orientador disponible
                    </div>
                </div>
            </div>
        </div>

        <div id="chatbot-mensajes">
            <div class="mensaje-wrapper bot">
                <div class="mensaje-container">
                    <img src="../assets/DinoBot02.png" class="mensaje-avatar" alt="DinoBot" />
                    <div class="mensaje-bubble">
                        <div class="mensaje-texto">¡Hola! Soy DinoBot, tu orientador de tutorías de la EPIIS. ¿En qué puedo ayudarte hoy?</div>
                        <span class="mensaje-timestamp">Ahora</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="chatbot-input-area">
            <input
                type="text"
                id="mensaje_input"
                placeholder="Escribe tu duda..."
                autocomplete="off"
            />
            <button id="chatbot-mic" title="Preguntar por voz">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v1a7 7 0 0 1-14 0v-1M12 19v4M8 23h8"></path>
                </svg>
            </button>
            <button id="boton_enviar">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
    <script src="../js/popup.js"></script>
</body>
</html>
